version: "3.9"

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ainyx_db
    environment:
      POSTGRES_USER: vishalkumar
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ainyx_users
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vishalkumar -d ainyx_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Application ──────────────────────────────────────────────────
  app:
    build: .
    container_name: ainyx_app
    ports:
      - "3000:3000"
    environment:
      APP_PORT: 3000
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: vishalkumar
      DB_PASSWORD: password
      DB_NAME: ainyx_users
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: